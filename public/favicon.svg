<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    탭 아이콘. 자매 앱과 같은 뼈대(둥근 사각형 + accent 색 그림)로 두되
    그림만 서가다. 탭이 여럿 떠 있을 때 세 앱을 색이 아니라 모양으로
    가려야 하기 때문이다 — 셋 다 같은 팔레트를 쓴다.

    색은 CSS 변수를 쓸 수 없다. 파비콘은 문서 밖에서 그려져 우리 :root 가
    닿지 않는다. Forest 라이트의 accent 값을 그대로 박아 둔다.
  -->
  <rect width="32" height="32" rx="8" fill="#1a1a17" />
  <g fill="none" stroke="#3f9f52" stroke-width="2.2" stroke-linecap="round">
    <path d="M9 8v16" />
    <path d="M14 8v16" />
    <path d="M19.5 8.8l4.5 15.4" />
  </g>
</svg>
